[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-tt"
version = "0.3.0"
description = "Spatio-temporal graph transformer for road-network traffic forecasting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arash Mozhdehi" }]
dependencies = [
  "torch>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "tqdm>=4.66",
  "mlflow>=2.16",
  "wandb>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gtt-train = "graph_tt.cli:train_main"
gtt-eval = "graph_tt.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
